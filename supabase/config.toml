# Configuração do Supabase CLI para o NEXUS.
# Deploy: veja docs/CONFIGURACAO.md (supabase link → supabase db push → supabase functions deploy)
project_id = "nexus"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Troque pelo endereço público do app (ex.: https://SEU-USUARIO.github.io/nexus/app/)
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# As funções validam a sessão por dentro (requireUser) e aceitam chamadas
# internas com o segredo NEXUS_INTERNAL_SECRET, por isso verify_jwt = false.
[functions.claude-chat]
verify_jwt = false

[functions.claude-channel]
verify_jwt = false

[functions.livekit-token]
verify_jwt = false

[functions.roblox]
verify_jwt = false

[functions.companion-run]
verify_jwt = false
