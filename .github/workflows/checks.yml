# Testes automáticos a cada push/PR: banco (regras de acesso), funções e app.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Banco de dados (regras de acesso, cargos, Companion)
        working-directory: supabase/tests
        run: |
          npm ci
          npm test

      - name: Funções do servidor (tipos + testes)
        run: |
          deno check supabase/functions/*/index.ts
          deno test --allow-net --allow-env supabase/functions/tests/

      - name: App web (tipos + regras de organização dos canais + build)
        working-directory: apps/web
        run: |
          npm ci
          node --experimental-strip-types tests/layout.test.mjs
          node --experimental-strip-types tests/screenShare.test.mjs
          npm run build
